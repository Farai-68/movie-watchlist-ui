<div class="login-container">
  <div class="login-card">
    <div class="card-header">
      <h2>Welcome Back</h2>
      <p>Sign in to manage your watchlist</p>
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder="you@example.com">
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <div style="display: flex; align-items: center; position: relative;">
         
          <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="password" required placeholder="••••••••" style="width: 100%; padding-right: 60px;">
          <button type="button" (click)="showPassword = !showPassword" style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; font-size: 0.85rem; color: #555;">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe"> Remember me
        </label>
        <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
      </div>

      <div *ngIf="errorMessage" class="error-box">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Signing In...' : 'Sign In' }}
      </button>
    </form> 

    <div class="card-footer">
      <p>Don't have an account? <a routerLink="/register">Sign up here</a></p>
    </div>
  </div>
</div>
