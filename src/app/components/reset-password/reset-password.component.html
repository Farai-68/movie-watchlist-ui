<div class="login-container">
  <div class="login-card">
    <div class="card-header">
      <h2>Set New Password</h2>
      <p>Please enter your new password below.</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="input-group">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required placeholder="••••••••">
      </div>

      <div class="input-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" required placeholder="••••••••">
      </div>

      <div *ngIf="successMessage" class="success-box">
        {{ successMessage }}
      </div>

      <div *ngIf="errorMessage" class="error-box">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading || !token">
        {{ isLoading ? 'Updating...' : 'Reset Password' }}
      </button>
    </form>
  </div>
</div>
