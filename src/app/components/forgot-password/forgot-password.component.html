<div class="login-container">
  <div class="login-card">
    <div class="card-header">
      <h2>Reset Password</h2>
      <p>Enter your email and we'll send you a reset link.</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder="you@example.com">
      </div>

      <div *ngIf="successMessage" class="success-box" style="color: green; margin-bottom: 15px;">
        {{ successMessage }}
      </div>

      <div *ngIf="errorMessage" class="error-box">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
      </button>
    </form>

    <div class="card-footer">
      <p>Remember your password? <a routerLink="/login">Back to login</a></p>
    </div>
  </div>
</div>
